# Bias study scenarios: which event logs to run and how to preprocess windows.
#
# Fields:
#   logs                  Keys in data_dictionary.json (dataset ids).
#   clear_name            Human-readable title for LaTeX / reports.
#   population_extractor  naive: no extra population model; chao1: Chao1-based population on the window.
#   normalizers           null: raw measures; default: project default normalizers (see DEFAULT_NORMALIZERS).
#   base_scenario_name    If set, metrics_comparison.csv can compare this run to that scenario's master.csv
#                         (null for baseline runs).

synthetic_base:
  logs: [O2C_S, CLAIM_S, LOAN_S, CREDIT_S]
  clear_name: "Synthetic (Base)"
  population_extractor: naive
  normalizers: null
  base_scenario_name: null

