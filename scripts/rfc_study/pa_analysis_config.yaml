# Preferential Attachment Analysis Configuration Template
#
# This file allows you to specify dataset-specific configurations for PA analysis.
#
# Structure:
#   - defaults: Default values used for all datasets (unless overridden)
#   - datasets: Dataset-specific overrides (keyed by dataset name)

defaults:
  # First t1_start value (start of first measurement window)
  first_t1_start: 100

  # Gap between t0_end and t1_start
  gap: 0

  # Step size between consecutive t1_start values
  step: 100

  # Length of measurement window (delta_t)
  delta_t: 200

  # Maximum number of windows to analyze
  max_windows: 10

  # Unit for window parameters: 'indices', 'months', or 'years'
  units: indices

# Dataset-specific configurations
# These override the defaults for each dataset
datasets:
  # Example: BPIC15_4 with year-based windows
  BPIC12:
    first_t1_start: 1
    gap: 0
    step: 1
    delta_t: 1
    units: months

  BPIC14:
    first_t1_start: 6
    gap: 0
    step: 6
    delta_t: 6
    units: months

  BPIC15_1:
    first_t1_start: 1
    gap: 0
    step: 1
    delta_t: 1
    units: years

  BPIC15_2:
    first_t1_start: 1
    gap: 0
    step: 1
    delta_t: 1
    units: years

  BPIC15_3:
    first_t1_start: 1
    gap: 0
    step: 1
    delta_t: 1
    units: years

  BPIC15_4:
    first_t1_start: 1
    gap: 0
    step: 1
    delta_t: 1
    units: years

  BPIC15_5:
    first_t1_start: 1
    gap: 0
    step: 1
    delta_t: 1
    units: years

  BPIC17:
    first_t1_start: 3
    gap: 0
    step: 3
    delta_t: 3
    units: months

  ITHD:
    first_t1_start: 1
    gap: 0
    step: 1
    delta_t: 1
    units: years

  RTFMP:
    first_t1_start: 1
    gap: 0
    step: 1
    delta_t: 1
    units: years

  # each synthetic dataset is 10,000 traces long - use one standard config
  CLAIM_S:
    first_t1_start: 1000
    gap: 0
    step: 1000
    delta_t: 1000
    units: indices

  LOAN_S:
    first_t1_start: 5000
    gap: 0
    step: 1000
    delta_t: 1000
    units: indices

  CREDIT_S:
    first_t1_start: 1000
    gap: 0
    step: 1000
    delta_t: 1000
    units: indices

  O2C_S:
    first_t1_start: 1000
    gap: 0
    step: 1000
    delta_t: 1000
    units: indices

  # Add more datasets as needed...
